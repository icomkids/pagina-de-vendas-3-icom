server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache leve pra assets
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
